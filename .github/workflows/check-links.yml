name: Check live links

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the six public demo URLs
        run: node scripts/check-links.mjs

      - name: Commit refreshed status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/link-status.json
          git diff --cached --quiet || git commit -m "chore: refresh live link status [skip ci]"
          git push
