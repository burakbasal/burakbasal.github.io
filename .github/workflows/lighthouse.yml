name: Lighthouse budget

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Serve the production build
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      - name: Run Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx --yes lighthouse@12 http://127.0.0.1:4173/ \
            --quiet \
            --output=json \
            --output-path=lighthouse-report.json \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo

      - name: Enforce score budget
        run: |
          node -e '
            const r = require("./lighthouse-report.json");
            const min = { performance: 0.95, accessibility: 1, "best-practices": 1, seo: 1 };
            const bad = Object.entries(min).filter(([k, v]) => r.categories[k].score < v);
            for (const [k, v] of Object.entries(min)) {
              console.log(`${k}: ${Math.round(r.categories[k].score * 100)} (min ${Math.round(v * 100)})`);
            }
            if (bad.length) process.exit(1);
          '

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
