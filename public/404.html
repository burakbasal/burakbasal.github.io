<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Sayfa bulunamadı — Burak Başal</title>
    <meta name="robots" content="noindex" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0 }
      html, body { min-height: 100% }
      body { background: #050505; color: #ededeb; font-family: ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; padding: 24px }
      main { width: min(100%, 640px) }
      p { color: #9d9da5; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase }
      h1 { font-size: clamp(3rem, 12vw, 7rem); line-height: .86; letter-spacing: -.07em; font-weight: 500; margin: 22px 0 18px }
      span { display: block; color: #8b8b93; font-size: 3vw; min-height: 1em }
      a { display: inline-flex; align-items: center; gap: 8px; margin-top: 34px; padding: 12px 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #ededeb; font-size: 12px; font-weight: 600; text-decoration: none }
      a:hover { border-color: #ededeb }
      svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
    </style>
  </head>
  <body>
    <main>
      <p>404 / Burak Başal</p>
      <h1>Burada<br />bir şey<span>yok.</span></h1>
      <a href="/">Ana sayfaya dön <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg></a>
    </main>
  </body>
</html>
